
[package]
name = "musicpi-home"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
] }
i-slint-backend-winit = { version = "1.18", default-features = false, features = [
    "renderer-software",
] }
winit = "0.30"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-software"]
pi = ["desktop"]

[build-dependencies]
slint-build = "1.18"
